name: Corrigir imagens Doctor Who 2005 e Estilhacos 2026
on:
  push:
    paths:
      - ".github/workflows/corrigir-doctor-estilhacos.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: corrigir-doctor-estilhacos
  cancel-in-progress: false
jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Validar scripts
        run: python -m py_compile scripts/corrigir_doctor_estilhacos.py scripts/importar_tmdb_tv.py scripts/atualizar_indice_series.py
      - name: Substituir imagens corretas nas duas pastas
        run: python scripts/corrigir_doctor_estilhacos.py
      - name: Atualizar indice real de imagens
        run: python scripts/atualizar_indice_series.py
      - name: Publicar imagens substituidas
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/series/doctor-who assets/series/estilhacos assets/series/INDICE.csv assets/series/RELATORIO_TMDB.json assets/series/RELATORIO_CORRECAO_DOCTOR_ESTILHACOS.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao"
            exit 0
          fi
          git commit -m "Substitui Doctor Who 1963 e novela turca por Doctor Who 2005 e The Shards 2026"
          git pull --rebase origin main
          git push origin HEAD:main
