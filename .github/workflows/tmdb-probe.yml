name: Verificacao de acesso ao TMDB
on:
  push:
    paths:
      - '.github/workflows/tmdb-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/tmdb_probe.py
