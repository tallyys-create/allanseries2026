name: Recuperar 3 pendentes - TV Allanzinho
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/recuperar-tv-allanzinho-pendentes.yml"
      - "scripts/recuperar_tres_tv.py"
      - "scripts/diagnosticar_tres_tv.py"
permissions:
  contents: write
concurrency:
  group: importar-tmdb-tv-allanzinho
  cancel-in-progress: false
jobs:
  recuperar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validar arquivos Python
        run: python -m py_compile scripts/recuperar_tres_tv.py scripts/importar_tmdb_tv.py scripts/importar_tmdb_filmes.py
      - name: Conferir acesso ao TMDB
        run: |
          if [ -z "$TMDB_API_KEY" ] && [ -z "$TMDB_READ_ACCESS_TOKEN" ]; then
            echo "::error::Configure o secret TMDB_API_KEY ou TMDB_READ_ACCESS_TOKEN."
            exit 1
          fi
      - name: Instalar bibliotecas
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Baixar somente os 3 titulos pendentes
        run: python scripts/recuperar_tres_tv.py
      - name: Publicar apenas os 3 titulos e o relatorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tv-allanzinho/pokemon-jornadas assets/tv-allanzinho/power-rangers-tempestade-ninja assets/tv-allanzinho/madeline assets/tv-allanzinho/RELATORIO_RECUPERACAO_TV.json
          if git diff --cached --quiet; then
            echo "Nenhum arquivo novo para publicar."
            exit 0
          fi
          git commit -m "Recupera posters e cenas dos tres titulos TV Allanzinho"
          git pull --rebase origin main
          git push origin HEAD:main
