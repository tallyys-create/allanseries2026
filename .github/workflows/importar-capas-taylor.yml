name: Importar capas verificadas Taylor Swift
on:
  push:
    paths:
      - ".github/workflows/importar-capas-taylor.yml"
      - "scripts/importar_capas_taylor.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: importar-capas-taylor
  cancel-in-progress: false
jobs:
  capas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check requests pillow
      - name: Buscar capas e gerar relatorio
        run: python scripts/importar_capas_taylor.py
      - name: Publicar capas nas pastas individuais
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/albuns/taylor-swift
          if git diff --cached --quiet; then
            echo "Nenhuma capa nova para publicar"
            exit 0
          fi
          git commit -m "Importa capas oficiais verificadas para tier Taylor Swift"
          git pull --rebase origin main
          git push origin HEAD:main
