name: Importar galerias de videoclipes Taylor Swift
on:
  push:
    paths:
      - ".github/workflows/importar-galerias-taylor.yml"
      - "scripts/importar_galerias_taylor.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: importar-galerias-taylor
  cancel-in-progress: false
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar bibliotecas
        run: python -m pip install --disable-pip-version-check requests pillow
      - name: Conferir sintaxe
        run: python -m py_compile scripts/importar_galerias_taylor.py
      - name: Buscar imagens dos clipes da Taylor Swift
        run: python scripts/importar_galerias_taylor.py
      - name: Publicar imagens e auditoria
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/albuns/taylor-swift
          if git diff --cached --quiet; then
            echo "Nenhuma imagem localizada"
            exit 0
          fi
          git commit -m "Importa galerias verificadas de clipes para os álbuns Taylor Swift"
          git pull --rebase origin main
          git push origin HEAD:main
