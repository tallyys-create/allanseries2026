name: Importar posters e cenas TMDB
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Indice inicial no catalogo (0 = primeiro)"
        required: false
        default: "0"
        type: string
      limit:
        description: "Quantidade de filmes (0 = todos)"
        required: false
        default: "0"
        type: string
      scenes:
        description: "Maximo de cenas por filme (1 a 10; recomendado: 10)"
        required: false
        default: "10"
        type: string
  push:
    paths:
      - ".github/workflows/importar-filmes-tmdb.yml"
      - "scripts/importar_tmdb_filmes.py"
permissions:
  contents: write
concurrency:
  group: importacao-tmdb-filmes
  cancel-in-progress: false
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validar script Python
        run: python -m py_compile scripts/importar_tmdb_filmes.py
      - name: Conferir autorizacao TMDB
        shell: bash
        run: |
          if [ -z "$TMDB_API_KEY" ] && [ -z "$TMDB_READ_ACCESS_TOKEN" ]; then
            echo "::error::Falta o segredo TMDB_API_KEY ou TMDB_READ_ACCESS_TOKEN. Adicione em Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
      - name: Instalar bibliotecas de imagens
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Buscar os filmes e baixar posters e fundos
        env:
          START: ${{ github.event.inputs.start || '0' }}
          LIMIT: ${{ github.event_name == 'push' && '10' || github.event.inputs.limit || '0' }}
          SCENES: ${{ github.event.inputs.scenes || '10' }}
        run: python scripts/importar_tmdb_filmes.py --start "$START" --limit "$LIMIT" --scenes "$SCENES"
      - name: Publicar arquivos nas pastas de assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/filmes
          if git diff --cached --quiet; then
            echo "Nenhum arquivo novo para enviar."
            exit 0
          fi
          git commit -m "Importa posters e cenas TMDB dos filmes"
          git pull --rebase origin main
          git push origin HEAD:main
