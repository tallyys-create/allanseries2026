name: Importar posters e cenas - Series (TMDB)
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Indice inicial no catalogo (0 = primeiro)"
        required: false
        default: "0"
        type: string
      limit:
        description: "Quantidade de titulos (0 = todos)"
        required: false
        default: "0"
        type: string
      scenes:
        description: "Maximo de imagens por titulo (1 a 10)"
        required: false
        default: "10"
        type: string
  push:
    paths:
      - ".github/workflows/importar-series-tmdb.yml"
      - "scripts/recuperar_series_pendentes.py"
permissions:
  contents: write
concurrency:
  group: importar-tmdb-series
  cancel-in-progress: false
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validar Python
        run: python -m py_compile scripts/importar_tmdb_tv.py scripts/importar_tmdb_filmes.py
      - name: Verificar autorizacao TMDB
        shell: bash
        run: |
          if [ -z "$TMDB_API_KEY" ] && [ -z "$TMDB_READ_ACCESS_TOKEN" ]; then
            echo "::error::Adicione TMDB_API_KEY ou TMDB_READ_ACCESS_TOKEN aos Secrets do repositorio."
            exit 1
          fi
      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Recuperar 14 series pendentes com identificacoes confirmadas
        if: github.event_name == 'push'
        run: python scripts/recuperar_series_pendentes.py
      - name: Buscar posters e ate 10 cenas - Series
        if: github.event_name == 'workflow_dispatch'
        env:
          START: ${{ github.event.inputs.start || '0' }}
          LIMIT: ${{ github.event.inputs.limit || '0' }}
          SCENES: ${{ github.event.inputs.scenes || '10' }}
        run: python scripts/importar_tmdb_tv.py --catalog series --start "$START" --limit "$LIMIT" --scenes "$SCENES"
      - name: Atualizar contagens reais do indice de series
        run: python scripts/atualizar_indice_series.py
      - name: Publicar imagens nas pastas do GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/series
          if git diff --cached --quiet; then
            echo "Nenhuma imagem ou relatorio novo para publicar."
            exit 0
          fi
          git commit -m "Importa imagens TMDB para Series"
          git pull --rebase origin main
          git push origin HEAD:main
